name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22.23.3 ships npm 10.9.9, which has no allowScripts field.
      # npm 12.2.0 applies the package.json allowlist to the same ci command.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/checkout@v4
        with:
          repository: FabioLeitao/zero-bridge
          path: zero-bridge
      - run: npm install -g npm@12.2.0
      - run: npm ci --ignore-scripts=false
      - run: npm run check
      - run: npm run build
      # ubuntu-latest already provides xvfb. Electron exits without DISPLAY.
      - run: xvfb-run -a npm run test:e2e
