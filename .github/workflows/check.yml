name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/checkout@v4
        with:
          repository: FabioLeitao/zero-bridge
          path: zero-bridge
      - run: npm ci --allow-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e
