name: package

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  schedule:
    # Monday 07:00 UTC. This job is not the fast check.
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/package.yml
      - bridge.sha
      - package.json
      - scripts/**
      - src/**

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Node 22.23.3 ships npm 10.9.9, which has no allowScripts field.
      # npm 12.2.0 applies the package.json allowlist to the same ci command.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: npm install -g npm@12.2.0
      # verify-linux-package.mjs calls xwininfo.
      - run: sudo apt-get update && sudo apt-get install -y x11-utils
      - run: npm ci --ignore-scripts=false
      - run: npm run build
      - run: npm run dist
      # Runner only. The extracted AppImage has no AppArmor profile; the deb
      # postinst installs one. This lets the sandbox use user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run verify:linux-package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          if-no-files-found: error
          path: |
            dist/packages/SHA256SUMS.txt
            dist/packages/sbom-*.json
